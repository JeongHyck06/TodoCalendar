name: TodoCalendar
options:
  bundleIdPrefix: com.jack
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '3'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Todo Calendar
    PRODUCT_BUNDLE_IDENTIFIER: com.jack.TodoCalendar
    PRODUCT_MODULE_NAME: TodoCalendar
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83NF7P2B8P
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Jeonghyeok Im
targets:
  TodoCalendar-iOS:
    productName: TodoCalendar
    type: application
    platform: iOS
    sources: [TodoCalendar]
    settings:
      base:
        PRODUCT_NAME: TodoCalendar
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TodoCalendar-macOS:
    productName: TodoCalendar
    type: application
    platform: macOS
    sources: [TodoCalendar]
    settings:
      base:
        PRODUCT_NAME: TodoCalendar
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  TodoCalendarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TodoCalendarTests]
    dependencies:
      - target: TodoCalendar-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.TodoCalendar.tests
        PRODUCT_MODULE_NAME: TodoCalendarTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TodoCalendar.app/Contents/MacOS/TodoCalendar
        BUNDLE_LOADER: $(TEST_HOST)
  TodoCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TodoCalendarUITests]
    dependencies:
      - target: TodoCalendar-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.TodoCalendar.uitests
        PRODUCT_MODULE_NAME: TodoCalendarUITests
schemes:
  TodoCalendar-iOS:
    build:
      parallelizeBuild: false
      targets:
        TodoCalendar-iOS: all
    test:
      targets: [TodoCalendarUITests]
  TodoCalendar-macOS:
    build:
      parallelizeBuild: false
      targets:
        TodoCalendar-macOS: all
    test:
      targets: [TodoCalendarTests]
